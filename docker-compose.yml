services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-shipping-agent:dev
    container_name: ai-shipping-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
      #HF_HUB_ENABLE_HF_TRANSFER: "0"   # faster, resilient downloads
    volumes:
      - ./qdrant_db:/app/qdrant_db
      - ./rag/data:/app/rag/data:ro
      - ./hf_cache:/home/appuser/.cache/huggingface   # <-- new: persist cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
