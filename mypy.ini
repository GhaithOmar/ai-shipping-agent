[mypy]
python_version = 3.11

# Treat paths as packages starting at the repo root.
explicit_package_bases = True
mypy_path = .

# Be lenient with 3rd-party/experimental modules for now.
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

# If apply_chat_template still complains on your mypy version:
[mypy-transformers.*]
disable_error_code = attr-defined, operator

[mypy-backend.generation]
disable_error_code = operator
