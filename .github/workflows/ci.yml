name: CI

on:
  push:
    branches: [ "main" ]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    name: Lint & Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache dirs (portable)
        shell: bash
        run: |
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
          echo "TRANSFORMERS_CACHE=$RUNNER_TEMP/hf-cache/transformers" >> "$GITHUB_ENV"
          echo "HF_DATASETS_CACHE=$RUNNER_TEMP/hf-cache/datasets" >> "$GITHUB_ENV"
          echo "TORCH_HOME=$RUNNER_TEMP/torch-cache" >> "$GITHUB_ENV"


      - name: Cache HF & Torch
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HF_HOME }}
            ${{ env.TORCH_HOME }}
          key: ${{ runner.os }}-hf-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install project deps
        run: |
          pip install -r requirements.txt || echo "no requirements.txt"
          pip install -r requirements-dev.txt || echo "no requirements-dev.txt"

      - name: Ruff (auto-fix import order)
        run: ruff check . --select I --fix
        
      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .


      - name: Run tests with coverage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >
          pytest -q tests/smoke/test_api_smoke.py
          --cov=backend --cov=rag
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=10


      - name: Run tests with coverage (Unix)
        if: runner.os != 'Windows'
        env:
          AGENT_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >
          pytest -q tests/smoke/test_api_smoke.py
          --cov=backend --cov=rag
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=10

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml






  docker-build:
    name: Docker Build (no push)
    needs: [tests]           # wait for lint & tests to pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with cache (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false                  # build only
          load: false                  # don’t load into local Docker on the runner
          tags: ai-shipping-agent:ci   # local tag label for logs
          cache-from: type=gha
          cache-to: type=gha,mode=max


  docker-publish:
    name: Docker Publish (GHCR on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ← allow pushing to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag        # → ghcr.io/OWNER/REPO:v0.8.0
            type=raw,value=latest     # → also tag “latest”
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build & Push (multi-arch optional)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64      # add linux/arm64 if you’ve tested it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true

  release:
    name: GitHub Release (notes)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  image-scan:
    name: Image Scan (Trivy)
    needs: [docker-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scan (load locally)
        run: docker build -t local/ai-shipping-agent:scan -f Dockerfile .

      - name: Scan with Trivy (fail on CRITICAL only)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: local/ai-shipping-agent:scan
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '1'
