name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    name: Lint & Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install project deps
        run: |
          pip install -r requirements.txt || echo "no requirements.txt"
          # Tools we use in CI:
          pip install pytest ruff black mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy) - non-blocking
        run: mypy backend/ rag/ || true

      - name: Run tests
        run: pytest -q
